name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
      - name: Restore
        run: dotnet restore "PortProxy.sln"
      - name: Build
        run: dotnet build "PortProxy.sln" -c Release --no-restore

